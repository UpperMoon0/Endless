plugins {
    id 'com.gradleup.shadow'
}

loom {
    // Renderer classes keep their upstream names, but their Minecraft call
    // sites need a production refmap. Static remapping skips @Mixin(remap=false).
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "endless-fabric-1.20.1-refmap.json"
    }
    runs {
        client {
            client()
            runDir("run/client")
        }
        server {
            server()
            runDir("run/server")
        }
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            vmArg "-Xmx2G"
            property "endless.liveJoinTest", "true"
            property "endless.liveJoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-4096'
            property "endless.liveJoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '4096'
            property "endless.liveJoinTest.preseedStaleRange", System.getenv('ENDLESS_TEST_PRESEED_STALE') ?: 'false'
            property "endless.liveJoinTest.expectLogical", (System.getenv('ENDLESS_TEST_PRESEED_STALE') == 'true') ? 'false' : 'true'
            property "endless.liveJoinTest.highY", System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            property "endless.liveJoinFarEnvelopeTest", System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            property "endless.liveJoinColdRestartPhase", System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArgs "--quickPlayMultiplayer", "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
        }
        sameJvmRejoinTestClient {
            client()
            runDir("run/live-rejoin/client")
            vmArg "-Xmx2G"
            property "endless.sameJvmRejoinTest", "true"
            property "endless.sameJvmRejoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1048576'
            property "endless.sameJvmRejoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1048576'
        }
        liveJoinTestServer {
            server()
            runDir("run/live-join/server")
            vmArg "-Xmx1536m"
            property "endless.liveJoinHighYTest", System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            property "endless.liveJoinFarEnvelopeTest", System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            property "endless.liveJoinColdRestartPhase", System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArg "nogui"
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$architectury_api_version"

    common(project(path: ':common-1.20.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.20.1', configuration: 'transformProductionFabric')

    // Real compatibility coverage only: normal development/runtime artifacts do
    // not acquire a hard Waystones dependency. Use the exact published
    // CurseForge files corresponding to canonical Waystones 14.1.20 and Balm
    // 7.3.38 so the established compatibility regression remains reproducible.
    if (System.getenv('ENDLESS_TEST_WAYSTONES') == 'true') {
        modRuntimeOnly "curse.maven:balm-fabric-500525:7420614"
        modRuntimeOnly "curse.maven:waystones-245755:7682268"
    } else {
        // Keep Waystones in normal development runs without creating a
        // production dependency. Compatibility CI intentionally stays pinned.
        modRuntimeOnly("net.blay09.mods:balm-fabric:" + rootProject.balm_version_1_20_1) { transitive = false }
        modRuntimeOnly("net.blay09.mods:waystones-fabric:" + rootProject.waystones_version_1_20_1) { transitive = false }
    }
}

repositories {
    maven {
        url = uri('https://www.cursemaven.com')
        content {
            includeGroup 'curse.maven'
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    modCompileOnly("maven.modrinth:embeddium:kJkE9dfS") { transitive = false }
}

// Development-only native framebuffer fixture; excluded from ordinary builds.
if (project.hasProperty("shaderPreview")) {
    configurations.configureEach { configuration ->
        if (configuration.name.toLowerCase().contains("runtime")) configuration.exclude group: "net.blay09.mods"
    }
    sourceSets.main.java.srcDir rootProject.file("renderer-preview/src/main/java")
    sourceSets.main.java.srcDir "src/shaderPreview/java"
    loom.runs { shaderPreviewClient { client(); runDir("run/shader-preview/.minecraft"); vmArg "-Xmx3G"; property "endless.shaderPreview", "true"; programArgs "--width", "640", "--height", "360" } }
    def previewBackend = project.findProperty("previewRenderer") ?: "embeddium"
    if (previewBackend == "sodium") configurations.configureEach {
        // Loom's Linux snapshot override is rejected by Sodium 0.5's native
        // driver gate. Test the exact LWJGL shipped by Minecraft 1.20.1.
        resolutionStrategy.eachDependency { dependency ->
            if (dependency.requested.group == "org.lwjgl") dependency.useVersion("3.3.1")
        }
    }
    def previewPin = previewBackend == "embeddium" ? 'kJkE9dfS' : (project.findProperty("previewSodiumPin") ?: "OihdIimA")
    if (previewPin == null) throw new GradleException("No Embeddium release for fabric-1.20.1")
    dependencies {
        modRuntimeOnly("maven.modrinth:${previewBackend}:${previewPin}") { transitive = false }
        if (project.hasProperty("previewIris")) modRuntimeOnly("maven.modrinth:iris:s5eFLITc") { transitive = false }
    }
}
