plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            property "endless.liveJoinTest", "true"
            programArgs "--quickPlayMultiplayer", "127.0.0.1:25575"
        }
        liveJoinTestServer {
            server()
            runDir("run/live-join/server")
            programArg "nogui"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$architectury_api_version"

    implementation project(':common')
    common(project(path: ':common-1.21.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.21.1', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
