modLoader = "javafml"
loaderVersion = "[47,)"
license = "All Rights Reserved"

[[mods]]
modId = "endless"
version = "${version}"
displayName = "Endless"
authors = "NsTut"
description = '''
Sparse practical infinite build height for Minecraft 1.20.1.
Keeps a bounded vanilla-compatible dense core and stores high-Y construction
in dedicated 512-block vertical pages up to Y +/-8,000,000.
Includes server-authoritative page sync, high-Y persistence, heightmaps,
block/fluid/block-entity routing, and page-aware lighting.
'''
logoFile = "assets/endless/icon.png"

[[dependencies.endless]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.endless]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.endless]]
modId = "architectury"
mandatory = true
versionRange = "[9.2.14,)"
ordering = "AFTER"
side = "BOTH"
