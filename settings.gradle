pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'endless'

include 'common'

include 'common-1.20.1'
include 'fabric-1.20.1'
include 'forge-1.20.1'

include 'common-1.21.1'
include 'fabric-1.21.1'
include 'neoforge-1.21.1'

include 'neoforge-26.1.2'

gradle.ext.mcVersionMapping = [
    ':common': 'shared',
    ':common-1.20.1': '1.20.1',
    ':fabric-1.20.1': '1.20.1',
    ':forge-1.20.1': '1.20.1',
    ':common-1.21.1': '1.21.1',
    ':fabric-1.21.1': '1.21.1',
    ':neoforge-1.21.1': '1.21.1',
    ':neoforge-26.1.2': '26.1.2',
]
