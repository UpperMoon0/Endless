name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and test (both loaders)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace --no-daemon
