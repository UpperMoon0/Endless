sourceSets.main.java {
    srcDir rootProject.file('common-versioned/src/main/java')
    srcDir rootProject.file('common-1201-1211/src/main/java')
}
sourceSets.test.java.srcDir rootProject.file('common-1201-1211/src/test/java')
sourceSets.test.java.srcDir rootProject.file('create-runtime-tests/src/test/java')

architectury {
    common project.enabled_platforms.split(',')
}

configurations { mixin085Regression }

repositories {
    exclusiveContent {
        forRepository {
            maven { url = uri('https://maven.minecraftforge.net') }
        }
        filter { includeModule 'org.spongepowered', 'mixin' }
    }
}

dependencies {
    mixin085Regression("org.spongepowered:mixin:0.8.5") { transitive = false }
    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    testImplementation "io.github.llamalad7:mixinextras-common:0.4.1"
    implementation project(':common')
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "dev.architectury:architectury:$architectury_api_version"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    doFirst {
        systemProperty 'endless.mixin085.jar', configurations.mixin085Regression.singleFile.absolutePath
    }
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        project(':common').sourceSets.main.output
    }
}
