name: Release

# Releases are version-driven. A release-workflow-only change may also run the
# pipeline when the current version has no tag yet, so a failed publication can
# be repaired without inventing a new mod version.
on:
  push:
    branches:
      - master
    paths:
      - gradle.properties
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endless-release
  cancel-in-progress: false

jobs:
  version-change:
    name: Check mod version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare mod_version with the previous revision
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          read_version() {
            sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' \
              | head -n1 | tr -d '\r' | xargs
          }

          current="$(read_version < gradle.properties)"
          [[ "$current" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] \
            || { echo "Invalid mod_version: $current" >&2; exit 1; }

          # Manual runs are explicit release attempts. Pushes release when the
          # version changed, or when that version is still untagged after a
          # previous failed publication. This makes CI fixes retry-safe.
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed=true
          else
            previous="$(git show "${BEFORE_SHA}:gradle.properties" | read_version)"
            echo "mod_version: ${previous} -> ${current}"
            [[ "$current" != "$previous" ]] && changed=true
          fi

          if ! git show-ref --tags --verify --quiet "refs/tags/v${current}"; then
            echo "v${current} is not tagged yet; publication is still pending."
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "value=$current" >> "$GITHUB_OUTPUT"

  preflight:
    name: Release preflight
    needs: version-change
    if: needs.version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release changelog exists before building
        shell: bash
        env:
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
        run: |
          set -euo pipefail
          changelog_path="changelogs/v${MOD_VERSION}.txt"
          [[ -f "$changelog_path" ]] || { echo "Missing release changelog: $changelog_path" >&2; exit 1; }
          [[ -s "$changelog_path" ]] || { echo "Empty release changelog: $changelog_path" >&2; exit 1; }
          echo "Release changelog found: $changelog_path"
      - name: Verify the version tag is free or points at this commit
        shell: bash
        env:
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
        run: |
          set -euo pipefail
          tag="v${MOD_VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/$tag")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to $tagged_commit, not this commit ($GITHUB_SHA). Bump mod_version before releasing another commit." >&2
              exit 1
            fi
            echo "Tag $tag already points at this commit; the release will reuse it."
          else
            echo "Tag $tag is free; the release will create it."
          fi

  verify:
    name: Regression tests
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run regression tests
        run: ./gradlew test --no-daemon --no-configuration-cache

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fabric
            project: fabric
            pattern: 'endless-fabric-*.jar'
          - platform: forge
            project: forge
            pattern: 'endless-forge-*.jar'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build loader jar
        run: ./gradlew :${{ matrix.project }}:build --no-daemon --no-configuration-cache
      - name: Select and inspect release jar
        id: release_file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find ${{ matrix.project }}/build/libs -maxdepth 1 -type f -name '${{ matrix.pattern }}' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort)
          [[ ${#jars[@]} -eq 1 ]] || { echo "Expected exactly one runnable ${{ matrix.platform }} JAR; found ${#jars[@]}" >&2; exit 1; }
          jar_path="${jars[0]}"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"
          contents="$(jar tf "$jar_path")"
          echo "$contents" | grep -q 'endless.mixins.json' || { echo "endless.mixins.json missing from $jar_path" >&2; exit 1; }
          if [[ "${{ matrix.platform }}" == fabric ]]; then
            echo "$contents" | grep -q '^fabric.mod.json$' || { echo "fabric.mod.json missing from $jar_path" >&2; exit 1; }
          else
            echo "$contents" | grep -q '^META-INF/mods.toml$' || { echo "META-INF/mods.toml missing from $jar_path" >&2; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: endless-${{ matrix.platform }}
          path: ${{ steps.release_file.outputs.jar_path }}
          if-no-files-found: error

  live-client:
    name: Live client join gate
    needs: verify
    uses: ./.github/workflows/live-join-test.yml

  publish-curseforge:
    name: Publish ${{ matrix.platform }} to CurseForge
    needs: [build, live-client]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fabric
            loader_name: Fabric
            dependencies: "419699(required)\n306612(required)"
          - platform: forge
            loader_name: Forge
            dependencies: "419699(required)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: endless-${{ matrix.platform }}
          path: curseforge-artifact
      - name: Select release file
        id: release_file
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          [[ "$mod_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] || { echo "Invalid mod_version: $mod_version" >&2; exit 1; }
          mapfile -t jars < <(find curseforge-artifact -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' | sort)
          [[ ${#jars[@]} -eq 1 ]] || { echo "Expected one runnable JAR; found ${#jars[@]}" >&2; exit 1; }
          printf 'mod_version=%s\njar_path=%s\n' "$mod_version" "${jars[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: 1252988
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: ${{ steps.release_file.outputs.jar_path }}
          name: Endless ${{ steps.release_file.outputs.mod_version }} - ${{ matrix.loader_name }} 1.20.1
          version: ${{ steps.release_file.outputs.mod_version }}-${{ matrix.platform }}
          version-type: release
          changelog-file: changelogs/v${{ steps.release_file.outputs.mod_version }}.txt
          loaders: ${{ matrix.platform }}
          game-versions: 1.20.1
          game-version-filter: none
          environment: client | server
          curseforge-dependencies: ${{ matrix.dependencies }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: fail

  release:
    name: Tag and GitHub release
    needs: [build, publish-curseforge, live-client]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read mod version
        id: version
        shell: bash
        run: |
          value="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Create version tag
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already points to this commit; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Endless $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Endless v${{ steps.version.outputs.value }}
          body_path: changelogs/v${{ steps.version.outputs.value }}.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
