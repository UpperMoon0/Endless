plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    // Renderer classes keep their upstream names, but their Minecraft call
    // sites need a production refmap. Static remapping skips @Mixin(remap=false).
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "endless-fabric-1.21.1-refmap.json"
    }
    runs {
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            vmArg "-Xmx2G"
            property "endless.liveJoinTest", "true"
            property "endless.liveJoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-4096'
            property "endless.liveJoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '4096'
            property "endless.liveJoinTest.preseedStaleRange", System.getenv('ENDLESS_TEST_PRESEED_STALE') ?: 'false'
            property "endless.liveJoinTest.expectLogical", (System.getenv('ENDLESS_TEST_PRESEED_STALE') == 'true') ? 'false' : 'true'
            property "endless.liveJoinTest.highY", System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            property "endless.liveJoinFarEnvelopeTest", System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            property "endless.liveJoinColdRestartPhase", System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArgs "--quickPlayMultiplayer", "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
        }
        sameJvmRejoinTestClient {
            client()
            runDir("run/live-rejoin/client")
            vmArg "-Xmx2G"
            property "endless.sameJvmRejoinTest", "true"
            property "endless.sameJvmRejoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1048576'
            property "endless.sameJvmRejoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1048576'
            property "endless.sameJvmRejoinTest.targetY", System.getenv('ENDLESS_TEST_TARGET_Y') ?: '1000000'
            property "endless.sameJvmRejoinTest.legacyLayout", System.getenv('ENDLESS_TEST_LEGACY_LAYOUT') ?: 'true'
        }
        liveJoinTestServer {
            server()
            runDir("run/live-join/server")
            vmArg "-Xmx1536m"
            property "endless.liveJoinHighYTest", System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            property "endless.liveJoinFarEnvelopeTest", System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            property "endless.liveJoinColdRestartPhase", System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArg "nogui"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$architectury_api_version"

    implementation project(':common')
    common(project(path: ':common-1.21.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.21.1', configuration: 'transformProductionFabric')

    // Optional compatibility mod in development runs only; not bundled or
    // declared as a production dependency.
    modRuntimeOnly("net.blay09.mods:balm-fabric:" + rootProject.balm_version_fabric_1_21_1) { transitive = false }
    modRuntimeOnly("net.blay09.mods:waystones-fabric:" + rootProject.waystones_version_fabric_1_21_1) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies { modCompileOnly("maven.modrinth:sodium:u1OEbNKx") { transitive = false } }

// Development-only native framebuffer fixture; excluded from ordinary builds.
if (project.hasProperty("shaderPreview")) {
    configurations.configureEach { configuration ->
        if (configuration.name.toLowerCase().contains("runtime")) configuration.exclude group: "net.blay09.mods"
    }
    sourceSets.main.java.srcDir rootProject.file("renderer-preview/src/main/java")
    loom.runs { shaderPreviewClient { client(); runDir("run/shader-preview/.minecraft"); vmArg "-Xmx3G"; property "endless.shaderPreview", "true"; programArgs "--width", "640", "--height", "360" } }
    def previewBackend = project.findProperty("previewRenderer") ?: "sodium"
    def previewPin = previewBackend == "embeddium" ? null : (project.findProperty("previewSodiumPin") ?: "u1OEbNKx")
    if (previewPin == null) throw new GradleException("No Embeddium release for fabric-1.21.1")
    dependencies {
        modRuntimeOnly("maven.modrinth:${previewBackend}:${previewPin}") { transitive = false }
        if (project.hasProperty("previewIris")) modRuntimeOnly("maven.modrinth:iris:zsoi0dso") { transitive = false }
    }
}
