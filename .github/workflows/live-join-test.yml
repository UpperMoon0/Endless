name: Live join test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "common/**"
      - "fabric/**"
      - "forge/**"
      - "tools/live_join_test.py"
      - ".github/workflows/live-join-test.yml"

jobs:
  live-join:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.20.1
          - target: forge-1.20.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build mod once
        run: ./gradlew build --no-daemon --no-configuration-cache

      - name: Run automatic real-client join test
        run: python3 tools/live_join_test.py --target "${{ matrix.target }}"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-join-${{ matrix.target }}
          path: |
            ${{ matrix.target == 'fabric-1.20.1' && 'fabric' || 'forge' }}/run/live-join/client/logs
            ${{ matrix.target == 'fabric-1.20.1' && 'fabric' || 'forge' }}/run/live-join/server/logs
          if-no-files-found: ignore
