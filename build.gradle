plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

/*
 * GitHub-hosted runners share outbound IP space. Maven Central can return a
 * hard HTTP 403 when the shared egress IP is blocked for aggregate automated
 * traffic, even though this project is only resolving normal dependencies.
 *
 * Google publishes a documented Maven Central mirror specifically suitable for
 * build environments. Redirect only the two canonical Central hosts, and only
 * on GitHub Actions. Local developer builds retain Loom/Gradle's normal
 * repository configuration.
 *
 * configureEach applies to repositories Loom adds later while configuring the
 * subprojects, which is where the Forge failure occurred.
 */
if (System.getenv('GITHUB_ACTIONS') == 'true') {
    def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org'] as Set
    def centralMirror = uri('https://maven-central.storage-download.googleapis.com/maven2/')
    allprojects {
        repositories.configureEach { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
                && repo.url != null
                && centralHosts.contains(repo.url.host)) {
                logger.lifecycle("Endless CI: Maven Central ${repo.url} -> ${centralMirror}")
                repo.setUrl(centralMirror)
            }
        }
        buildscript.repositories.configureEach { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
                && repo.url != null
                && centralHosts.contains(repo.url.host)) {
                logger.lifecycle("Endless CI: Maven Central ${repo.url} -> ${centralMirror}")
                repo.setUrl(centralMirror)
            }
        }
    }
}

/*
 * Development run-task UX
 *
 * This is a multi-project Architectury workspace:
 *
 *   :common
 *   :fabric
 *   :forge
 *
 * A bare Gradle task selector such as:
 *
 *   ./gradlew runClient
 *
 * matches runClient tasks in multiple subprojects. That can start more than
 * one Minecraft instance, and :common may look like another Fabric launch.
 *
 * Never allow the ambiguous selectors. Developers must select a loader
 * explicitly, either through the convenience tasks below or with a fully
 * qualified task path such as :fabric:runClient.
 */
def ambiguousRunTasks = ['runClient', 'runServer']

def ambiguousRequestedTasks = gradle.startParameter.taskNames.findAll { taskName ->
    ambiguousRunTasks.contains(taskName)
}

if (!ambiguousRequestedTasks.isEmpty()) {
    throw new GradleException(
        "Ambiguous Minecraft run task '${ambiguousRequestedTasks.join(', ')}'.\n" +
        "Endless is a multi-loader workspace. Use one of:\n" +
        "  ./gradlew runFabricClient\n" +
        "  ./gradlew runForgeClient\n" +
        "  ./gradlew runFabricServer\n" +
        "  ./gradlew runForgeServer\n" +
        "or a fully qualified task such as:\n" +
        "  ./gradlew :fabric:runClient\n" +
        "  ./gradlew :forge:runClient"
    )
}

tasks.register('runFabricClient') {
    group = 'minecraft'
    description = 'Launch the Endless Fabric development client.'
    dependsOn(':fabric:runClient')
}

tasks.register('runForgeClient') {
    group = 'minecraft'
    description = 'Launch the Endless Forge development client.'
    dependsOn(':forge:runClient')
}

tasks.register('runFabricServer') {
    group = 'minecraft'
    description = 'Launch the Endless Fabric development server.'
    dependsOn(':fabric:runServer')
}

tasks.register('runForgeServer') {
    group = 'minecraft'
    description = 'Launch the Endless Forge development server.'
    dependsOn(':forge:runServer')
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
