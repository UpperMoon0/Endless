plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_name}-neoforge-${rootProject.minecraft_version_1_21_1}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.java {
    srcDir rootProject.file('common/src/main/java')
    srcDir rootProject.file('common-1.21.1/src/main/java')
}
sourceSets.main.resources {
    srcDir rootProject.file('common-1.21.1/src/main/resources')
}

neoForge {
    version = rootProject.neoforge_version_1_21_1

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        liveJoinTestClient {
            client()
            gameDirectory = project.file('run/live-join/client')
            systemProperty 'endless.liveJoinTest', 'true'
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25575'
        }
        liveJoinTestServer {
            server()
            gameDirectory = project.file('run/live-join/server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.10.1"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
}
