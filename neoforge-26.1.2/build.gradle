plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_name}-neoforge-${rootProject.minecraft_version_26_1_2}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common-versioned/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common-modern/src/main/java')

neoForge {
    version = rootProject.neoforge_version_26_1_2

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        liveJoinTestClient {
            client()
            gameDirectory = project.file('run/live-join/client')
            systemProperty 'endless.liveJoinTest', 'true'
            systemProperty 'endless.liveJoinTest.expectedMin', System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-4096'
            systemProperty 'endless.liveJoinTest.expectedMax', System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '4096'
            systemProperty 'endless.liveJoinTest.preseedStaleRange', System.getenv('ENDLESS_TEST_PRESEED_STALE') ?: 'false'
            systemProperty 'endless.liveJoinTest.expectLogical', (System.getenv('ENDLESS_TEST_PRESEED_STALE') == 'true') ? 'false' : 'true'
            systemProperty 'endless.liveJoinTest.highY', System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            systemProperty 'endless.liveJoinWaystonesTest', System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            systemProperty 'endless.liveJoinFarEnvelopeTest', System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            systemProperty 'endless.liveJoinColdRestartPhase', System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArguments.addAll '--quickPlayMultiplayer', "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
        }
        sameJvmRejoinTestClient {
            client()
            gameDirectory = project.file('run/live-rejoin/client')
            systemProperty 'endless.sameJvmRejoinTest', 'true'
            systemProperty 'endless.sameJvmRejoinTest.expectedMin', System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1048576'
            systemProperty 'endless.sameJvmRejoinTest.expectedMax', System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1048576'
            systemProperty 'endless.sameJvmRejoinTest.targetY', System.getenv('ENDLESS_TEST_TARGET_Y') ?: '1000000'
            systemProperty 'endless.sameJvmRejoinTest.legacyLayout', System.getenv('ENDLESS_TEST_LEGACY_LAYOUT') ?: 'true'
        }
        liveJoinTestServer {
            server()
            gameDirectory = project.file('run/live-join/server')
            systemProperty 'endless.liveJoinHighYTest', System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            systemProperty 'endless.liveJoinWaystonesTest', System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            systemProperty 'endless.liveJoinFarEnvelopeTest', System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            systemProperty 'endless.liveJoinColdRestartPhase', System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArgument '--nogui'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.10.1"

    // Optional compatibility mod in development runs only; production metadata
    // remains dependency-free.
    runtimeOnly("net.blay09.mods:balm-neoforge:" + rootProject.balm_version_26_1_2) { transitive = false }
    runtimeOnly("net.blay09.mods:shogi-neoforge:" + rootProject.shogi_version_26_1_2) { transitive = false }
    runtimeOnly("net.blay09.mods:waystones-neoforge:" + rootProject.waystones_version_26_1_2) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
}

repositories { maven { url = 'https://api.modrinth.com/maven' } }
configurations { sodiumCompileArchive }
dependencies { sodiumCompileArchive("maven.modrinth:sodium:zg4YQ9EL") { transitive = false } }
def sodiumApi = tasks.register('prepareSodiumApi', Copy) {
    from { zipTree(configurations.sodiumCompileArchive.singleFile) }
    include 'META-INF/jarjar/*-mod.jar'
    eachFile { path = 'sodium-api.jar' }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('renderer-api')
}
dependencies { compileOnly files(layout.buildDirectory.file("renderer-api/sodium-api.jar")).builtBy(sodiumApi) }

// Development-only native framebuffer fixture; excluded from ordinary builds.
if (project.hasProperty("shaderPreview")) {
    configurations.configureEach { configuration ->
        if (configuration.name.toLowerCase().contains("runtime")) configuration.exclude group: "net.blay09.mods"
    }
    sourceSets.main.java.srcDir rootProject.file("renderer-preview-26/src/main/java")
    neoForge.runs { shaderPreviewClient { client(); gameDirectory = project.file("run/shader-preview/.minecraft"); systemProperty "endless.shaderPreview", "true"; jvmArgument "-Xmx3G"; programArguments.addAll "--width", "640", "--height", "360" } }
    def previewBackend = project.findProperty("previewRenderer") ?: "sodium"
    def previewPin = previewBackend == "embeddium" ? null : (project.findProperty("previewSodiumPin") ?: "zg4YQ9EL")
    if (previewPin == null) throw new GradleException("No Embeddium release for neoforge-26.1.2")
    dependencies {
        runtimeOnly("maven.modrinth:${previewBackend}:${previewPin}") { transitive = false }
        if (project.hasProperty("previewIris")) runtimeOnly("maven.modrinth:iris:qE5Y7GrZ") { transitive = false }
    }
}
