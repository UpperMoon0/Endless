plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "endless.mixins.json"

        runs {
            client {
                client()
                runDir("run/client")
                vmArg "-Xmx6G"
                vmArg "-Xms2G"
            }
            server {
                server()
                runDir("run/server")
                vmArg "-Xmx6G"
                vmArg "-Xms2G"
            }
            liveJoinTestClient {
                client()
                runDir("run/live-join/client")
                vmArg "-Xmx2G"
                property "endless.liveJoinTest", "true"
                property "endless.liveJoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1024'
                property "endless.liveJoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1024'
                property "endless.liveJoinTest.preseedStaleRange", System.getenv('ENDLESS_TEST_PRESEED_STALE') ?: 'false'
                property "endless.liveJoinTest.expectLogical", (System.getenv('ENDLESS_TEST_PRESEED_STALE') == 'true') ? 'false' : 'true'
                property "endless.liveJoinTest.highY", (System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1024') == '-1024' ? 'true' : 'false'
                programArgs "--quickPlayMultiplayer", "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
            }
            liveJoinTestServer {
                server()
                runDir("run/live-join/server")
                vmArg "-Xmx1536m"
                property "endless.liveJoinHighYTest", "true"
                programArg "nogui"
            }
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    if (file('libs/balm-forge-7.3.37+1.20.1.jar').exists()) {
        modRuntimeOnly "net.blay09.mods:balm-forge:7.3.37+1.20.1"
    }
    if (file('libs/waystones-forge-14.1.20+1.20.1.jar').exists()) {
        modRuntimeOnly "net.blay09.mods:waystones-forge:14.1.20+1.20.1"
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
