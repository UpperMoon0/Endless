name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency:
  group: endless-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (both loaders)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --stacktrace --no-daemon

  metadata:
    name: Metadata drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release metadata for stale claims
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md
            CURSEFORGE.md
            fabric/src/main/resources/fabric.mod.json
            forge/src/main/resources/META-INF/mods.toml
          )
          # Claims that were true for pre-v0.4 releases only. Changelogs are
          # historical records and deliberately not checked.
          patterns=('2097152' '2,097,152' '8192' '-4096' 'remove limits' 'removes or customizes')
          for f in "${files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing metadata file: $f" >&2
              exit 1
            fi
            for p in "${patterns[@]}"; do
              if grep -Fqi -- "$p" "$f"; then
                echo "Stale claim '$p' found in $f" >&2
                exit 1
              fi
            done
          done
          grep -Fq 'versionRange = "[1.20.1]"' forge/src/main/resources/META-INF/mods.toml \
            || { echo 'Forge minecraft dependency must pin [1.20.1]' >&2; exit 1; }
          grep -Fq '"minecraft": "=1.20.1"' fabric/src/main/resources/fabric.mod.json \
            || { echo 'Fabric minecraft dependency must pin =1.20.1' >&2; exit 1; }
          echo "Metadata ok"
