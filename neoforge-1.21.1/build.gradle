plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_name}-neoforge-${rootProject.minecraft_version_1_21_1}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.java {
    srcDir rootProject.file('common/src/main/java')
    srcDir rootProject.file('common-versioned/src/main/java')
    srcDir rootProject.file('common-1201-1211/src/main/java')
    srcDir rootProject.file('common-1.21.1/src/main/java')
    srcDir rootProject.file('common-modern/src/main/java')
}
sourceSets.main.resources {
    srcDir rootProject.file('common-1.21.1/src/main/resources')
}

neoForge {
    version = rootProject.neoforge_version_1_21_1

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        liveJoinTestClient {
            client()
            gameDirectory = project.file('run/live-join/client')
            systemProperty 'endless.liveJoinTest', 'true'
            systemProperty 'endless.liveJoinTest.expectedMin', System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-4096'
            systemProperty 'endless.liveJoinTest.expectedMax', System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '4096'
            systemProperty 'endless.liveJoinTest.preseedStaleRange', System.getenv('ENDLESS_TEST_PRESEED_STALE') ?: 'false'
            systemProperty 'endless.liveJoinTest.expectLogical', (System.getenv('ENDLESS_TEST_PRESEED_STALE') == 'true') ? 'false' : 'true'
            systemProperty 'endless.liveJoinTest.highY', System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            systemProperty 'endless.liveJoinWaystonesTest', System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            systemProperty 'endless.liveJoinCreateTest', System.getenv('ENDLESS_TEST_CREATE') ?: 'false'
                systemProperty 'endless.liveCreateGameTests', System.getenv('ENDLESS_TEST_CREATE_GROUP') ?: ''
                systemProperty 'endless.liveCreatePlayerWorkflows', System.getenv('ENDLESS_TEST_CREATE_PLAYER') ?: 'false'
                systemProperty 'endless.liveCreateTrains', System.getenv('ENDLESS_TEST_CREATE_TRAINS') ?: 'false'
            systemProperty 'endless.liveJoinFarEnvelopeTest', System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            systemProperty 'endless.liveJoinColdRestartPhase', System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArguments.addAll '--quickPlayMultiplayer', "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
        }
        sameJvmRejoinTestClient {
            client()
            gameDirectory = project.file('run/live-rejoin/client')
            systemProperty 'endless.sameJvmRejoinTest', 'true'
            systemProperty 'endless.sameJvmRejoinTest.expectedMin', System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1048576'
            systemProperty 'endless.sameJvmRejoinTest.expectedMax', System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1048576'
            systemProperty 'endless.sameJvmRejoinTest.targetY', System.getenv('ENDLESS_TEST_TARGET_Y') ?: '1000000'
            systemProperty 'endless.sameJvmRejoinTest.legacyLayout', System.getenv('ENDLESS_TEST_LEGACY_LAYOUT') ?: 'true'
        }
        liveJoinTestServer {
            server()
            gameDirectory = project.file('run/live-join/server')
            systemProperty 'endless.liveJoinHighYTest', System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            systemProperty 'endless.liveJoinWaystonesTest', System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            systemProperty 'endless.liveJoinCreateTest', System.getenv('ENDLESS_TEST_CREATE') ?: 'false'
                systemProperty 'endless.liveCreateGameTests', System.getenv('ENDLESS_TEST_CREATE_GROUP') ?: ''
                systemProperty 'endless.liveCreatePlayerWorkflows', System.getenv('ENDLESS_TEST_CREATE_PLAYER') ?: 'false'
                systemProperty 'endless.liveCreateTrains', System.getenv('ENDLESS_TEST_CREATE_TRAINS') ?: 'false'
            systemProperty 'endless.liveJoinFarEnvelopeTest', System.getenv('ENDLESS_TEST_FAR') ?: 'false'
            systemProperty 'endless.liveJoinColdRestartPhase', System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.10.1"

    // Optional compatibility mod in development runs only; production metadata
    // remains dependency-free.
    runtimeOnly("net.blay09.mods:balm-neoforge:" + rootProject.balm_version_neoforge_1_21_1) { transitive = false }
    runtimeOnly("net.blay09.mods:waystones-neoforge:" + rootProject.waystones_version_neoforge_1_21_1) { transitive = false }
    if (System.getenv('ENDLESS_TEST_CREATE') == 'true') {
        runtimeOnly("com.simibubi.create:create-1.21.1:6.0.11-312") { transitive = false }
        runtimeOnly("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67") { transitive = false }
        runtimeOnly("net.createmod.ponder:ponder-neoforge:1.0.85+mc1.21.1") { transitive = false }
        runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6") { transitive = false }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
}

// Custom SavedData without a vanilla DFU type relies on NeoForge's patched
// DimensionDataStorage. Exercise that real loader boundary, not Loom's vanilla
// common-test classpath (which does not support null DataFixTypes).
sourceSets.test.java.srcDir rootProject.file('create-runtime-tests/src/test/java')
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
test {
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
}
neoForge {
    unitTest {
        enable()
        testedMod = mods.endless
    }
}

repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    compileOnly("maven.modrinth:embeddium:J7b96IEd") { transitive = false }
}

dependencies { compileOnly("maven.modrinth:sodium:Pb3OXVqC") { transitive = false } }

// Development-only native framebuffer fixture; excluded from ordinary builds.
if (project.hasProperty("shaderPreview")) {
    configurations.configureEach { configuration ->
        if (configuration.name.toLowerCase().contains("runtime")) configuration.exclude group: "net.blay09.mods"
    }
    sourceSets.main.java.srcDir rootProject.file("renderer-preview/src/main/java")
    sourceSets.main.java.srcDir "src/shaderPreview/java"
    neoForge.runs { shaderPreviewClient { client(); gameDirectory = project.file("run/shader-preview/.minecraft"); systemProperty "endless.shaderPreview", "true"; jvmArgument "-Xmx3G"; programArguments.addAll "--width", "640", "--height", "360" } }
    def previewBackend = project.findProperty("previewRenderer") ?: "embeddium"
    def previewPin = previewBackend == "embeddium" ? 'J7b96IEd' : (project.findProperty("previewSodiumPin") ?: "Pb3OXVqC")
    if (previewPin == null) throw new GradleException("No Embeddium release for neoforge-1.21.1")
    // Sodium 0.8 ships a LIBRARY bootstrap containing the actual mod as a
    // nested jar. FML 4's userdev locator selects the bootstrap itself for the
    // nested sodium identity when it is a Maven runtime dependency. Exercise
    // the unchanged release jar through the normal mods-folder locator.
    def bootstrapPreview = previewBackend == "sodium" && previewPin == "uMOpc5uV"
    if (bootstrapPreview) configurations.create("rendererBootstrapPreview")
    dependencies {
        if (bootstrapPreview) rendererBootstrapPreview("maven.modrinth:${previewBackend}:${previewPin}") { transitive = false }
        else runtimeOnly("maven.modrinth:${previewBackend}:${previewPin}") { transitive = false }
        if (project.hasProperty("previewIris")) runtimeOnly("maven.modrinth:iris:t3ruzodq") { transitive = false }
    }
    tasks.named("runShaderPreviewClient").configure {
        doFirst {
            def destination = project.file("run/shader-preview/.minecraft/mods/endless-preview-sodium.jar")
            if (bootstrapPreview) {
                destination.parentFile.mkdirs()
                java.nio.file.Files.copy(configurations.rendererBootstrapPreview.singleFile.toPath(), destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else java.nio.file.Files.deleteIfExists(destination.toPath())
        }
    }
}
