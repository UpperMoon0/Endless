plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    runs {
        client {
            client()
            runDir("run/client")
        }
        server {
            server()
            runDir("run/server")
        }
        liveJoinTestClient {
            client()
            runDir("run/live-join/client")
            vmArg "-Xmx2G"
            property "endless.liveJoinTest", "true"
            property "endless.liveJoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1024'
            property "endless.liveJoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1024'
            property "endless.liveJoinTest.preseedStaleRange", System.getenv('ENDLESS_TEST_PRESEED_STALE') ?: 'false'
            property "endless.liveJoinTest.expectLogical", (System.getenv('ENDLESS_TEST_PRESEED_STALE') == 'true') ? 'false' : 'true'
            property "endless.liveJoinTest.highY", (System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1024') == '-1024' ? 'true' : 'false'
            property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            programArgs "--quickPlayMultiplayer", "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
        }
        liveJoinTestServer {
            server()
            runDir("run/live-join/server")
            vmArg "-Xmx1536m"
            property "endless.liveJoinHighYTest", System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
            property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
            programArg "nogui"
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Real compatibility coverage only: normal development/runtime artifacts do
    // not acquire a hard Waystones dependency. Versions are pinned from the
    // canonical Waystones 1.20.1 branch (Waystones 14.1.20, Balm 7.3.38).
    if (System.getenv('ENDLESS_TEST_WAYSTONES') == 'true') {
        modRuntimeOnly "net.blay09.mods:balm-fabric:7.3.38+1.20.1"
        modRuntimeOnly "net.blay09.mods:waystones-fabric:14.1.20+1.20.1"
    }
}

repositories {
    maven {
        url = uri('https://maven.twelveiterations.com/repository/maven-releases/')
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
