modLoader = "javafml"
loaderVersion = "[47,)"
#issueTrackerURL = "https://github.com/UpperMoon0/Endless/issues"
license = "All Rights Reserved"

[[mods]]
modId = "endless"
version = "${version}"
displayName = "Endless"
authors = "NsTut"
description = '''
A Minecraft mod that customizes the world build height range.
Extends the vertical world height through simple configuration, within
the packed block position envelope.
Set minimum/maximum build heights in config/endless.json; worlds remember
the range they were played with.
'''
logoFile = "assets/endless/icon.png"

[[dependencies.endless]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.endless]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.endless]]
modId = "architectury"
mandatory = true
versionRange = "[9.2.14,)"
ordering = "AFTER"
side = "BOTH"
