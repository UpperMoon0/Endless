plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "endless.mixins.json"

        runs {
            client {
                client()
                runDir("run/client")
                vmArg "-Xmx6G"
                vmArg "-Xms2G"
            }
            server {
                server()
                runDir("run/server")
                vmArg "-Xmx6G"
                vmArg "-Xms2G"
            }
            liveJoinTestClient {
                client()
                runDir("run/live-join/client")
                // Smoke-test sized heaps: the CI runner also runs a Gradle
                // supervisor process, so large -Xms/-Xmx pairs cause
                // memory-pressure flakiness on hosted runners.
                vmArg "-Xmx2G"
                property "endless.liveJoinTest", "true"
                // Expected effective range and server port come from the
                // harness (tools/live_join_test.py) so one run config serves
                // every live-join scenario; defaults match the
                // extended-server case.
                property "endless.liveJoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1024'
                property "endless.liveJoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1024'
                programArgs "--quickPlayMultiplayer", "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
            }
            liveJoinTestServer {
                server()
                runDir("run/live-join/server")
                vmArg "-Xmx1536m"
                programArg "nogui"
            }
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    if (file('libs/balm-forge-7.3.37+1.20.1.jar').exists()) {
        modRuntimeOnly "net.blay09.mods:balm-forge:7.3.37+1.20.1"
    }
    if (file('libs/waystones-forge-14.1.20+1.20.1.jar').exists()) {
        modRuntimeOnly "net.blay09.mods:waystones-forge:14.1.20+1.20.1"
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
