plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "endless.mixins.json"

        runs {
            client {
                client()
                runDir("run/client")
                vmArg "-Xmx6G"
                vmArg "-Xms2G"
            }
            server {
                server()
                runDir("run/server")
                vmArg "-Xmx6G"
                vmArg "-Xms2G"
            }
            liveJoinTestClient {
                client()
                runDir("run/live-join/client")
                vmArg "-Xmx2G"
                property "endless.liveJoinTest", "true"
                property "endless.liveJoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-4096'
                property "endless.liveJoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '4096'
                property "endless.liveJoinTest.preseedStaleRange", System.getenv('ENDLESS_TEST_PRESEED_STALE') ?: 'false'
                property "endless.liveJoinTest.expectLogical", (System.getenv('ENDLESS_TEST_PRESEED_STALE') == 'true') ? 'false' : 'true'
                property "endless.liveJoinTest.highY", System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
                property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
                property "endless.liveJoinFarEnvelopeTest", System.getenv('ENDLESS_TEST_FAR') ?: 'false'
                property "endless.liveJoinColdRestartPhase", System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
                programArgs "--quickPlayMultiplayer", "127.0.0.1:${System.getenv('ENDLESS_TEST_PORT') ?: '25575'}"
            }
            sameJvmRejoinTestClient {
                client()
                runDir("run/live-rejoin/client")
                vmArg "-Xmx2G"
                property "endless.sameJvmRejoinTest", "true"
                property "endless.sameJvmRejoinTest.expectedMin", System.getenv('ENDLESS_TEST_EXPECTED_MIN') ?: '-1048576'
                property "endless.sameJvmRejoinTest.expectedMax", System.getenv('ENDLESS_TEST_EXPECTED_MAX') ?: '1048576'
            }
            liveJoinTestServer {
                server()
                runDir("run/live-join/server")
                vmArg "-Xmx1536m"
                property "endless.liveJoinHighYTest", System.getenv('ENDLESS_TEST_EXTREME') ?: 'false'
                property "endless.liveJoinWaystonesTest", System.getenv('ENDLESS_TEST_WAYSTONES') ?: 'false'
                property "endless.liveJoinFarEnvelopeTest", System.getenv('ENDLESS_TEST_FAR') ?: 'false'
                property "endless.liveJoinColdRestartPhase", System.getenv('ENDLESS_TEST_COLD_RESTART_PHASE') ?: ''
                programArg "nogui"
            }
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$forge_version"

    modImplementation "dev.architectury:architectury-forge:$architectury_api_version"

    common(project(path: ':common-1.20.1', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-1.20.1', configuration: 'transformProductionForge')

    // Compatibility CI stays pinned to its established exact CurseForge files
    // for Waystones 14.1.20 and Balm 7.3.38; normal dev runs use current releases.
    if (System.getenv('ENDLESS_TEST_WAYSTONES') == 'true') {
        modRuntimeOnly "curse.maven:balm-531761:7420617"
        modRuntimeOnly "curse.maven:waystones-245755:7682270"
    } else {
        // Normal developer clients/servers include current Waystones releases;
        // the explicit compatibility scenario above keeps its pinned fixture.
        modRuntimeOnly("net.blay09.mods:balm-forge:" + rootProject.balm_version_1_20_1) { transitive = false }
        modRuntimeOnly("net.blay09.mods:waystones-forge:" + rootProject.waystones_version_1_20_1) { transitive = false }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        url = uri('https://www.cursemaven.com')
        content {
            includeGroup 'curse.maven'
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
