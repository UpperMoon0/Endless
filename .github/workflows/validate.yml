name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency:
  group: endless-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/fabric-loom
      - run: rm -rf "$GRADLE_USER_HOME/caches/fabric-loom"
      - run: chmod +x gradlew
      - run: ./gradlew testAllVersions --stacktrace --no-daemon

  build-1201:
    name: Build Minecraft 1.20.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/fabric-loom
      - run: rm -rf "$GRADLE_USER_HOME/caches/fabric-loom"
      - run: chmod +x gradlew
      - run: ./gradlew :fabric-1.20.1:build :forge-1.20.1:build --stacktrace --no-daemon
      - name: Verify packaged optional-mod Minecraft selectors
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          python3 tools/check_create_mixin_refmap.py "forge-1.20.1/build/libs/endless-forge-1.20.1-${version}.jar"
          python3 tools/check_embeddium_mixin_refmap.py "forge-1.20.1/build/libs/endless-forge-1.20.1-${version}.jar"
          python3 tools/check_renderer_packaging.py "fabric-1.20.1/build/libs/endless-fabric-1.20.1-${version}.jar"

  build-1211:
    name: Build Minecraft 1.21.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/fabric-loom
      - run: rm -rf "$GRADLE_USER_HOME/caches/fabric-loom"
      - run: chmod +x gradlew
      - run: ./gradlew :fabric-1.21.1:build :neoforge-1.21.1:build --stacktrace --no-daemon
      - name: Verify packaged renderer hooks
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          python3 tools/check_renderer_packaging.py "fabric-1.21.1/build/libs/endless-fabric-1.21.1-${version}.jar" "neoforge-1.21.1/build/libs/endless-neoforge-1.21.1-${version}.jar"

  build-26:
    name: Build NeoForge 26.1.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :neoforge-26.1.2:build --stacktrace --no-daemon
      - name: Verify packaged renderer hooks
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          python3 tools/check_renderer_packaging.py "neoforge-26.1.2/build/libs/endless-neoforge-26.1.2-${version}.jar"

  harness:
    name: Harness and metadata tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 tools/check_multiversion_metadata.py
