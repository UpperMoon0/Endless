name: Renderer smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: endless-render-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  framebuffer:
    name: Framebuffer (${{ matrix.target }}, ${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: forge-1.20.1, backend: embeddium, renderer: embeddium}
          - {target: forge-1.20.1, backend: oculus, renderer: embeddium}
          - {target: fabric-1.20.1, backend: embeddium, renderer: embeddium}
          - {target: fabric-1.20.1, backend: sodium, renderer: sodium}
          - {target: fabric-1.20.1, backend: iris, renderer: sodium}
          - {target: fabric-1.21.1, backend: sodium, renderer: sodium}
          - {target: fabric-1.21.1, backend: sodium-0.8, renderer: sodium, pin: SMxNOGZ6}
          - {target: fabric-1.21.1, backend: iris, renderer: sodium}
          - {target: neoforge-1.21.1, backend: embeddium, renderer: embeddium}
          - {target: neoforge-1.21.1, backend: sodium, renderer: sodium}
          - {target: neoforge-1.21.1, backend: iris, renderer: sodium}
          - {target: neoforge-1.21.1, backend: sodium-0.8, renderer: sodium, pin: uMOpc5uV}
          - {target: neoforge-26.1.2, backend: sodium, renderer: sodium}
          - {target: neoforge-26.1.2, backend: iris, renderer: sodium}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ !(matrix.target == 'forge-1.20.1' && matrix.backend == 'embeddium') }}
          gradle-home-cache-excludes: |
            caches/fabric-loom
      - name: Prepare display and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
          rm -rf "$GRADLE_USER_HOME/caches/fabric-loom"
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp .github/gradle/ci-maven-central-mirror.init.gradle "$GRADLE_USER_HOME/init.d/"
          chmod +x gradlew
      - name: Capture generated fixture world
        env:
          BACKEND: ${{ matrix.backend }}
          TARGET: ${{ matrix.target }}
          RENDERER: ${{ matrix.renderer }}
          SODIUM_PIN: ${{ matrix.pin }}
        run: |
          args=()
          if [[ "$BACKEND" == oculus ]]; then args+=(--oculus); fi
          if [[ "$BACKEND" == iris ]]; then args+=(--iris); fi
          if [[ -n "$SODIUM_PIN" ]]; then args+=(--sodium-pin "$SODIUM_PIN"); fi
          python3 tools/render_smoke_test.py --target "$TARGET" --renderer "$RENDERER" "${args[@]}"
      - name: Require exact-head rendering receipt
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipts = list(Path('build/render-smoke').glob('*/pass.json'))
          assert len(receipts) == 1
          receipt = json.loads(receipts[0].read_text())
          assert receipt['head'] == os.environ['EXACT_HEAD']
          assert receipt['dirty'] is False
          PY
      - name: Upload frames, measurements and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-smoke-${{ matrix.target }}-${{ matrix.backend }}
          path: |
            build/render-smoke/**
            ${{ matrix.target }}/run/shader-preview/.minecraft/logs/**
            ${{ matrix.target }}/run/shader-preview/.minecraft/crash-reports/**
          if-no-files-found: error
