name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency:
  group: endless-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile port matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/fabric-loom
      - run: rm -rf "$GRADLE_USER_HOME/caches/fabric-loom"
      - run: chmod +x gradlew
      - name: Shared tests and legacy builds
        run: ./gradlew :common:test :common-1.20.1:test :fabric-1.20.1:build :forge-1.20.1:build --stacktrace --no-daemon
      - name: Compile Minecraft 1.21.1 common implementation
        run: ./gradlew :common-1.21.1:compileJava --stacktrace --no-daemon

  harness:
    name: Harness tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
